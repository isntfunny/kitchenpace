name: Deploy Live

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

env:
    COOLIFY_APP_UUID: z3vcihuvscm7lxdxh4ssg63j
    IMAGE: registry.isntfunny.de/kitchenpace

jobs:
    # smoke test – run e2e against running beta site
    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '24'

            - name: Cache node_modules
              id: cache
              uses: actions/cache@v4
              with:
                  path: node_modules
                  key: node-modules-${{ hashFiles('package-lock.json') }}

            - name: Install dependencies
              if: steps.cache.outputs.cache-hit != 'true'
              run: npm ci

            - name: Run E2E tests against beta
              run: npx playwright test
              env:
                  E2E_BASE_URL: https://beta.xn--kchentakt-q9a.de
                  E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
                  E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

            - uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 14

    # build production image from source (no beta dependency)
    build-and-push:
        runs-on: ubuntu-latest
        needs: e2e
        steps:
            - uses: actions/checkout@v4

            - name: Log in to Docker registry
              run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login registry.isntfunny.de -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

            - name: Build & push image
              run: |
                  TAG="${GITHUB_REF_NAME#v}"
                  SHORT_SHA="${GITHUB_SHA:0:7}"

                  docker build \
                    --build-arg "NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY=${{ secrets.TURNSTILE_SITE_KEY }}" \
                    --build-arg "NEXT_PUBLIC_CAST_APP_ID=${{ secrets.CAST_APP_ID }}" \
                    --build-arg "NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}" \
                    -t "$IMAGE:$TAG" \
                    -t "$IMAGE:latest" \
                    -t "$IMAGE:$SHORT_SHA" \
                    .

                  docker push "$IMAGE:$TAG"
                  docker push "$IMAGE:latest"
                  docker push "$IMAGE:$SHORT_SHA"

    deploy:
        runs-on: ubuntu-latest
        needs: [e2e, build-and-push]
        steps:
            - name: Trigger Coolify redeploy
              run: |
                  curl -fsSL -X GET \
                    "https://deploy.isntlab.de/api/v1/deploy?uuid=${{ env.COOLIFY_APP_UUID }}&force=false" \
                    -H "Authorization: Bearer ${{ secrets.DEPLOYMENT_KEY }}"
